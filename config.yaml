data_root: data/raw
static_input_root: inputs_static
instance: "100.20.1"

constraints:
  Lw: 3600

objective:
  mode: weighted
  lambda_w: 0.05
  drop_penalty: 50.0
  weights:
    makespan: 0.5
    unserved: 0.5

gp:
  pop_size: 120
  intermed_size: 30
  generations: 20
  max_depth: 6
  rm: 0.5
  rc: 0.7
  tournament_k: 2

  seed: 42
  seed_ratio: 0.15
  seed_pairs:
    - ["min(TERM0, TERM4)", "min(TERM0, TERM4)"] # near + nearest-next
    - ["min(TERM0, TERM3)", "TERM3"] # near + balance load
    - ["TERM1", "TERM2"] # demand vs rem cap
    - ["min(TERM1, TERM4)", "TERM3"] # demand small + nearest-next
    - ["max(TERM1, TERM5)", "min(TERM2, TERM4)"] # prioritize small demand, balance
    - ["min(TERM0, TERM6)", "min(TERM4, TERM6)"]
    - ["min(TERM1, TERM3)", "min(TERM1, TERM3)"]

log_dir: runs
